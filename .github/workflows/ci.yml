name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # —— MoonBit 工具链（跟随 latest，见 AGENTS.md；官方 CDN 不托管历史版本）——
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check MoonBit version
        run: moon version --all

      # —— Bun ——
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: MoonBit tests (含 golden 数值对齐)
        run: moon test src/types src/quadtree src/forces src/simulation

      - name: Build wasm-gc (release)
        run: moon build --target wasm-gc --release

      - name: Assert wasm import section empty (可移植性)
        run: bun scripts/check-wasm.mjs _build/wasm-gc/release/build/src/ffi/ffi.wasm

      - name: Build npm package
        run: bun scripts/build.mjs

      - name: TS 端到端测试 (含 d3-force 数值对齐)
        run: bun test packages/moonforce

      - name: Format check
        run: moon fmt --check
