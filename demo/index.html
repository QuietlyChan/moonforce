<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moonforce — MoonBit 力导向布局引擎 (WASM-GC)</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #d2a8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 .bit { color: var(--accent); }
  header h1 .force { color: var(--accent2); }
  header .tagline { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  #controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .ctrl label { white-space: nowrap; }
  .ctrl input[type=range] { width: 110px; }
  .ctrl .val { min-width: 44px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  select, button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #stage { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #status {
    display: flex; gap: 20px; padding: 8px 16px; font-size: 12px;
    background: var(--panel); border-top: 1px solid var(--border);
    color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap;
  }
  #status b { color: var(--text); font-weight: 500; }
  #status .hl { color: var(--accent); }
  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: var(--muted); background: rgba(13,17,23,.7); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="bit">moon</span><span class="force">force</span></h1>
    <span class="tagline">MoonBit → WASM-GC · d3-force 兼容 · Barnes-Hut O(N log N)</span>
    <span class="spacer"></span>
    <div id="controls">
      <select id="dataset"></select>
      <div class="ctrl"><label>斥力</label><input type="range" id="charge" min="-200" max="-10" step="5" value="-60"><span class="val" id="chargeVal">-60</span></div>
      <div class="ctrl"><label>边长</label><input type="range" id="dist" min="10" max="100" step="5" value="30"><span class="val" id="distVal">30</span></div>
      <div class="ctrl"><label>碰撞</label><input type="range" id="collide" min="0" max="20" step="1" value="3"><span class="val" id="collideVal">3</span></div>
      <div class="ctrl"><label>阻尼</label><input type="range" id="friction" min="10" max="95" step="5" value="40"><span class="val" id="frictionVal">0.40</span></div>
      <button id="reheat">重跑</button>
      <a href="bench.html" target="_blank"><button>性能对比 →</button></a>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">拖拽节点固定 · 拖背景平移 · 滚轮缩放</div>
  </div>
  <div id="status">
    <span>节点 <b id="stNodes">–</b></span>
    <span>边 <b id="stEdges">–</b></span>
    <span>FPS <b id="stFps" class="hl">–</b></span>
    <span>tick <b id="stTick" class="hl">–</b> ms</span>
    <span>alpha <b id="stAlpha">–</b></span>
    <span>状态 <b id="stState">–</b></span>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
